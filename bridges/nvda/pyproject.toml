# Bridge (NVDA addon) tooling config. The addon itself is built with scons
# (see sconstruct); this file only configures the linters/type-checker.

[project]
name = "nvda-mcp-bridge"
version = "0.0.0"
# NVDA 2026.1 embeds CPython 3.13; matches the pyright pythonVersion below and
# silences uv's "No requires-python value found" warning.
requires-python = ">=3.13"
dependencies = []

[tool.uv]
# Built with scons into a .nvda-addon, never pip-installed, so uv manages the
# dev env but does not try to build/install this project itself.
package = false

[tool.pytest.ini_options]
# The bridge domain is stdlib-only and unit-tested headlessly under desktop
# Python 3.13. tests/conftest.py syncs the shared wire module in and puts the
# package on sys.path (no NVDA, no stubs). Only the pure domain is exercised.
testpaths = ["tests"]

# Live-NVDA tests are EXCLUDED by default, and that is a safety property, not a
# speed one. They drive a REAL NVDA on the developer's own desktop: they press
# gestures, open the Run dialog, type into whatever has focus, and change the
# reader's configuration. They were harmless only by accident -- they skip when
# nothing is listening on the pipe -- so a developer running `pytest` with their
# own NVDA and bridge up got their machine taken over with no warning. For a
# blind developer that is their screen reader being commandeered mid-task.
#
# Opt in deliberately with `uv run poe live`, or `pytest -m live_nvda`.
addopts = "-m 'not live_nvda'"
markers = [
	"live_nvda: drives a REAL NVDA on this machine. Excluded by default; see above.",
	# A handful of live checks are about WALL-CLOCK time -- the 300 s interaction
	# window, the 120 s inactivity watchdog -- so they cannot be hurried without
	# testing different numbers than the ones the add-on ships with. They are
	# release-gate checks, not inner-loop ones: `poe live` skips them, `poe
	# live-slow` runs them.
	"slow: takes minutes of real time. Skipped even by `poe live`; run `poe live-slow`.",
]

[tool.ruff]
line-length = 110

builtins = ["_", "ngettext", "pgettext", "npgettext"]
include = ["*.py"]

# sconstruct joins site_scons/ (excluded at the repo root) as VENDORED from the
# NVDA AddonTemplate scaffold: upstream's code, upstream's formatting, and
# reformatting it would only make the next scaffold sync noisy for no gain.
#
# It used to be listed in `include` above, with a per-file F821 ignore for the
# globals scons injects -- so the config CLAIMED it was linted while the gate's
# path list (`ruff check addon tests buildVars.py sync_shared.py`) never pointed
# ruff at it. Nothing ran, and the ignore made it look deliberate. Excluding it
# outright is the same outcome the gate already had, said out loud.
#
# site_scons/ is here for the same reason. It was excluded only at the REPO ROOT
# config, which does not govern this directory -- harmless while the gate named
# four explicit paths, but the gate now lints `.`, so this is what actually
# keeps upstream's code out of it.
exclude = [".git", "__pycache__", "sconstruct", "site_scons"]

[tool.ruff.format]
indent-style = "tab"

[tool.ruff.lint]
# CHOSEN, not inherited. Ruff's default selection has widened across releases --
# 0.16 turns on bandit (S), blind-except (BLE), datetimez (DTZ) and pep8-naming
# (N) among others -- so a project with no `select` is enforcing whatever the
# installed ruff happens to ship, and a version bump silently changes the rules.
# Listing them makes a change to what this repo enforces a deliberate edit.
select = [
	"F",   # pyflakes -- undefined names, unused imports: real errors
	"E",   # pycodestyle errors, incl. E501 line length and E402 import placement
	"W",   # pycodestyle warnings
	"I",   # import sorting -- mechanical, and the thing that drifts most
	"UP",  # pyupgrade -- hold to the 3.13 NVDA actually embeds
	"B",   # bugbear -- real bug shapes
	"SIM", # simplify
	"RUF", # ruff's own, including unused-noqa
]

# Deliberately NOT selected, each because it fights something this codebase does
# on purpose:
#   N   -- the package is `nvdaMcpBridge`; camelCase is NVDA's add-on convention.
#   BLE -- Session._guard and every adapter stop() catch broadly on purpose, so a
#          failing teardown step can never skip the ones after it.
#   S   -- same guard idiom (S110 try-except-pass).
#   DTZ -- session filenames and transcript stamps are deliberately local time.
#   PL  -- pylint's refactor opinions are not this project's house style.
ignore = [
	"W191",   # tabs ARE the house style; [tool.ruff.format] enforces them
	"SIM105", # try/except/pass in teardown is deliberate and carries a comment
	          # explaining why. contextlib.suppress would read better and is worth
	          # its own pass over the stop() paths, not a drive-by here.
]

[tool.ruff.lint.per-file-ignores]
# buildVars.py is NVDA's add-on manifest in Python form: addon_info carries the
# summary and description the add-on store DISPLAYS, as single strings. Wrapping
# them would change what a user reads in the store, so the length stands.
"buildVars.py" = ["E501"]

# E402 (import not at top) is STRUCTURAL in these four: each puts globalPlugins
# on sys.path, or syncs the shared wire module in, before it can import
# `nvdaMcpBridge.*` at all -- so the imports genuinely cannot come first. Listed
# here rather than as a `# noqa: E402` on each of the fourteen import lines,
# because the reason belongs to the file, not to the line.
"tests/integration/test_live_nvda_e2e.py" = ["E402"]
"tests/integration/test_live_nvda_pipe_e2e.py" = ["E402"]
"tests/integration/test_profile_override.py" = ["E402"]
"tests/unit/domain/controllers/commands/test_hello.py" = ["E402"]

# Same shape, different mechanism: this one installs a STUB `logHandler` module
# into sys.modules before importing the adapter, which does `from logHandler
# import Formatter, log` at module level. Import it first and you import NVDA's
# real logHandler, which does not exist headlessly.
"tests/unit/adapters/test_nvda_log_capture.py" = ["E402"]
# Same reason: NVDA's speech/braille extension points are stubbed into
# sys.modules before the three capture source adapters can be imported.
"tests/unit/adapters/test_capture_sources_carry_the_log_position.py" = ["E402"]
# And again: the silent source imports speech.commands and queueHandler at module
# level, so both have to be in sys.modules before the import line runs.
"tests/unit/adapters/test_silent_mode_keeps_speech_callbacks_alive.py" = ["E402"]
# Its mirror module, same source and therefore the same stubbing.
"tests/unit/adapters/test_nvda_silent_speech_source.py" = ["E402"]
# And the continuous-read adapter, whose `speech.sayAll` stub must be in
# sys.modules before it is imported.
"tests/unit/adapters/test_continuous_read.py" = ["E402"]

[tool.pyright]
pythonVersion = "3.13"       # NVDA 2026.1 embeds CPython 3.13
pythonPlatform = "Windows"
typeCheckingMode = "strict"

# Tell pyright WHICH environment to resolve imports against. Without this it
# uses whatever interpreter it inherits, so the same code reports 0 errors under
# `uv run --with pytest` and ~140 phantom "Import could not be resolved" errors
# under a bare invocation -- and the phantoms bury the real diagnostics.
venvPath = "."
venv = ".venv"

# The PURE domain (and the pure adapters, and the tests) are strict-checked.
# There is NO NVDA source dependency and NO vendored stubs: the side-effecting
# edge that imports NVDA is exempted via `ignore` below, because the domain it
# serves is fully checked and the edge is validated by live-NVDA integration
# tests (milestone 6). See AGENTS.md "Internal architecture — ports & adapters".
include = ["addon/globalPlugins/nvdaMcpBridge", "buildVars.py", "tests"]
exclude = ["sconstruct", ".git", "__pycache__"]

# The NVDA-importing edge: unresolved NVDA imports here raise nothing. Keep
# these files thin (glue only); real logic belongs in the checked domain. The
# adapters/nvda_*.py glob covers every NVDA-importing adapter (the sources, the
# announcer, the session-signals beeps, and the nvda_main_thread wx helper).
#
# test_profile_override.py is the same edge on the test side: unlike the other
# live-NVDA tests, which are pure socket/pipe clients and type-check normally,
# it runs INSIDE NVDA's own Python and imports `config` directly, so every
# expression through `config.conf` is untyped here and fully typed there. It is
# validated by being run in NVDA, exactly as the nvda_*.py adapters are.
ignore = [
    "addon/globalPlugins/nvdaMcpBridge/plugin.py",
    "addon/globalPlugins/nvdaMcpBridge/adapters/nvda_*.py",
    "addon/globalPlugins/nvdaMcpBridge/views/",
    "tests/integration/test_profile_override.py",
]

# So `import nvdaMcpBridge.*` (the package) and `import fakes` (test helpers)
# resolve without an installed package or an NVDA checkout.
extraPaths = ["./addon/globalPlugins", "./tests"]

analyzeUnannotatedFunctions = true
reportMissingModuleSource = false

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    # Configured in [tool.ruff] above and named in every spec's definition of
    # done, but it was never declared here -- so "ruff green" could not actually
    # be run, and nobody could tell a new violation from a pre-existing one.
    "ruff>=0.8",
]
