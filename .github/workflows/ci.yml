name: CI

# Job names are SHORT and STABLE -- `shared`, `server`, `nvda-bridge` -- on
# purpose. Branch protection matches required status checks by this literal
# string, so a descriptive job name couples the merge gate to the job's
# *contents*: renaming it (e.g. when the bridge stopped needing an NVDA
# checkout) silently parks every PR on "Expected - waiting for status to be
# reported" until someone edits the repo settings to match. Keep the detail in
# STEP names, which are free to change. Do not "improve" these names.
#
# WHAT EACH JOB RUNS LIVES IN pyproject.toml, NOT HERE. Every job below installs
# a toolchain and then calls exactly one task -- `uv run poe ci-<job>`. This file
# used to spell out the commands itself, which meant there were two definitions
# of "green" that had to be kept in step by hand, and they drifted: `poe ci` grew
# a lint task the workflow never ran, the workflow's ruff step covered `addon
# tests` while poe covered two more files, and staticcheck and the Linux build
# existed ONLY here -- so a developer could not run them at all and first learned
# of a failure from a red PR.
#
# The practical rule: a change to WHAT CI checks is a change to pyproject.toml,
# where it can be run and proved before it is pushed. This file changes only when
# a job needs a different TOOLCHAIN.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shared:
    name: shared
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Wire-contract tests, pyright, ruff (lint AND format), and the gate that
      # the committed schema.json still matches protocol.py. No Go toolchain
      # here on purpose -- `ci-shared` must not reach for one, and this job is
      # what proves it hasn't started to.
      - name: poe ci-shared
        run: uv run poe ci-shared

  # Go since entry 10a (spec 0013). The JOB NAME is unchanged on purpose --
  # branch protection matches required checks by the literal name, so the
  # language change is invisible to the merge gate.
  server:
    name: server
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # 1.25 since 10b: the official MCP Go SDK declares `go 1.25.0`, so the
      # module that depends on it must too. Nothing else asked for the bump.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: server/go.sum
      # uv is here to run poe, not to run Python tooling -- this job has no
      # Python project. It is the price of the job's contents having one
      # definition, and it is a few seconds.
      - uses: astral-sh/setup-uv@v5
      # Build, vet, unit and integration tests, staticcheck (PINNED in the task
      # -- this used to be `go install ...@latest`, which let an upstream release
      # turn the repo red with no commit of ours behind it, and the bisect starts
      # by hunting for a change that does not exist), the wire-binding drift
      # gate, and the Linux build proving the named-pipe leaf compiles OUT for a
      # future non-Windows host.
      - name: poe ci-server
        run: uv run poe ci-server

  # Cross-language conformance (entry 10c, spec 0013 deliverable 19). The one
  # job where BOTH implementations of specs/wire/v1/ are real: the Go server
  # (built, and driven over stdio like an MCP host would) against the real Python
  # bridge (headless, no NVDA), over a real named pipe AND real loopback TCP.
  #
  # WHY IT IS A SEPARATE JOB. Every test in the `server` job drives a Go fake
  # bridge that encodes with the same generated binding the server decodes with,
  # so a bug IN THE BINDING is invisible there -- both sides would be wrong
  # together, in agreement. This job is what replaced the same-bytes drift
  # guarantee the two halves had while both were Python, so a run that could not
  # reach the real bridge FAILS rather than skipping: the tests have no fall-back
  # path, and tests/architecture keeps anyone from adding one.
  #
  # NEW JOB NAME, therefore a new required-check decision: branch protection
  # matches required status checks by literal name, so adding this to
  # required_status_checks is a deliberate settings edit made AFTER the job has
  # reported once (this file's header, and AGENTS.md's gotcha).
  conformance:
    name: conformance
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: server/go.sum
      # The bridge is stdlib-only, so a bare interpreter of the right version is
      # the whole requirement. The tests probe for one by running it and fail
      # loudly if there is none.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
      # -count=1 lives in the task, so a cached PASS can never stand in for a run
      # that did not actually reach the bridge.
      - name: poe ci-conformance
        run: uv run poe ci-conformance

  nvda-bridge:
    name: nvda-bridge
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Syncs the shared wire module into the addon, then the headless bridge
      # tests, pyright, and ruff over the addon, the tests, buildVars.py,
      # sync_shared.py AND the dev scripts -- the last of which no project's
      # config reached until the lint gate landed. The domain is pure (no NVDA)
      # and the NVDA edge is in pyright's ignore list, so no NVDA source
      # checkout and no stubs are needed.
      - name: poe ci-bridge
        run: uv run poe ci-bridge
