[project]
name = "nvda-mcp-wire"
version = "0.1.0"
description = "Shared, stdlib-only JSON-lines wire protocol for nvda-mcp (bridge <-> server)."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-2.0-or-later"
authors = [{ name = "Marlon Brandao de Sousa", email = "marlon.bsousa@gmail.com" }]
# INTENTIONALLY ZERO RUNTIME DEPENDENCIES. This package is copied verbatim into
# NVDA's embedded interpreter; it must never grow a third-party import.
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pyright>=1.1.390", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nvda_mcp_wire"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.format]
indent-style = "tab"

[tool.ruff.lint]
# Kept identical to bridges/nvda/pyproject.toml on purpose: protocol.py is
# COPIED into the add-on by sync_shared, so the same bytes are linted in two
# projects and must not be able to pass one and fail the other. See that file
# for why each family is in or out.
select = ["F", "E", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
	"W191",   # tabs, per the NVDA/addon house style
	"SIM105", # deliberate try/except/pass, commented at each site
]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["nvda_mcp_wire", "tests"]

# Which environment to resolve imports against. Without it pyright uses whatever
# interpreter it inherits, and reports every test import as unresolved under a
# bare invocation while reporting none under `uv run --with pytest`.
venvPath = "."
venv = ".venv"
