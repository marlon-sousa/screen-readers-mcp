[project]
name = "screenreader-wire"
version = "0.1.0"
description = "Shared, stdlib-only JSON-lines wire protocol for screen-readers-mcp (bridge <-> server)."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-2.0-or-later"
authors = [{ name = "Marlon Brandao de Sousa", email = "marlon.bsousa@gmail.com" }]
# INTENTIONALLY ZERO RUNTIME DEPENDENCIES. This package is copied verbatim into
# NVDA's embedded interpreter; it must never grow a third-party import.
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pyright>=1.1.390", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["screenreader_wire"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

# Ruff 0.16 formats Python code blocks inside Markdown. Excluded for the same
# reason as at the repo root: doc snippets are illustrative, sometimes aligned
# by hand to make a point, and reformatting them buys nothing.
extend-exclude = ["*.md"]

[tool.ruff.format]
indent-style = "tab"

[tool.ruff.lint]
# Kept identical to bridges/nvda/pyproject.toml on purpose: protocol.py is
# COPIED into the add-on by sync_shared, so the same bytes are linted in two
# projects and must not be able to pass one and fail the other. See that file
# for why each family is in or out.
select = ["F", "E", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
	"W191",   # tabs, per the NVDA/addon house style
	"SIM105", # deliberate try/except/pass, commented at each site
]

# pyright is configured in ./pyrightconfig.json, NOT here.
#
# It moved out of this file so that the repo-root pyrightconfig.json -- which
# exists to give an editor/LSP launched at the repo root the same view the gates
# have -- cannot hijack this project. Pyright walks UP the tree looking for a
# pyrightconfig.json, and an ancestor pyrightconfig.json outranks a LOCAL
# [tool.pyright] in pyproject.toml. It does NOT outrank a local
# pyrightconfig.json. So this project keeps its own JSON file, and the settings
# below are the ones that used to live here:
#
#   pythonVersion "3.11", typeCheckingMode "strict",
#   include ["screenreader_wire", "tests"], venvPath "." and venv ".venv".
#
# venvPath/venv are the load-bearing pair: without them pyright resolves imports
# against whatever interpreter it inherits, and reports every test import as
# unresolved under a bare invocation while reporting none under
# `uv run --with pytest`. scripts/doctor.py checks they are still set.
#
# Do not re-add a [tool.pyright] section here: pyrightconfig.json wins, so it
# would be dead config that silently drifts. doctor.py fails if one reappears.
